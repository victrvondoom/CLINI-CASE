<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ClinCase mark">
  <!-- Two curved arrows forming a loop across the three tiles -->
  <path d="M22 16 C 44 6, 62 6, 78 20" stroke="#4b5563" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M78 20 l -9 -3 M78 20 l -2 -9" stroke="#4b5563" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M74 80 C 52 90, 34 90, 18 76" stroke="#9ca3af" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M18 76 l 9 3 M18 76 l 2 9" stroke="#9ca3af" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left tile: dark, contains "<" -->
  <rect x="4" y="30" width="30" height="30" rx="8" fill="#111827"/>
  <path d="M24 37 L15 45 L24 53" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Middle tile: mid gray, contains ">" -->
  <rect x="33" y="30" width="30" height="30" rx="8" fill="#6b7280"/>
  <path d="M43 37 L52 45 L43 53" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right tile: light, dark border, contains medical cross -->
  <rect x="62" y="30" width="30" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <path d="M77 39 v12 M71 45 h12" stroke="#111827" stroke-width="3.2" stroke-linecap="round"/>
</svg>
