    <title>CLINI-CASE — One Health Interoperability Gateway</title>
    <meta name="description" content="Evidence-aware One Health interoperability preserving provenance, consent and human review across validated OAH/FHIR exchanges." />
    <!-- No-flash theme bootstrap: light by default, dark if persisted. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("clincase-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
