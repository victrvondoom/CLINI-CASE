[project]
name = "clincase-backend"
version = "0.1.0"
description = "ClinCase prior-authorisation copilot backend"
requires-python = ">=3.11"

dependencies = [
  # --- Core (smoke test today) ----------------------------------------
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "asyncpg==0.30.0",
  "sse-starlette==2.1.3",
  "structlog==24.4.0",
  "anthropic==0.39.0",
  "boto3==1.35.50",
  "python-dotenv==1.0.1",
  "httpx==0.27.2",
  "openai==1.52.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.2.0",

  # --- Agents + RAG (added May 1+) ------------------------------------
  "langchain==0.3.7",
  "langchain-anthropic==0.2.4",
  "langgraph==0.2.45",
  "fhir.resources==7.1.0",
  "pypdf==5.0.1",
  "pgvector==0.3.6",

  # --- Document rendering + intake (round 17) -------------------------
  "reportlab==4.5.0",       # appeal-letter PDF renderer
  "python-multipart==0.0.18", # FastAPI multipart/form-data for /intake uploads
  "Pillow==11.0.0",         # PIL classifier in Document Intake
  "python-docx==1.2.0",     # DOCX policy uploads
  "pypdfium2==4.30.0",      # PDF page rasterization for OCR fallback
  "pytesseract==0.3.13",    # local OCR fallback (requires tesseract binary)

  # --- Multi-replica SSE pub/sub (SCALE-7) ----------------------------
  "redis==5.2.0",
  "numpy==1.26.4",          # OncoTwin numerical runtime (direct dependency)
]

# Heavy deps deferred to optional. sentence-transformers pulls torch
# (~2 GB). We install only when we actually need pgvector embeddings.
[project.optional-dependencies]
embeddings = [
  "sentence-transformers==3.2.1",
]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "hypothesis==6.115.5",    # property-based security and routing invariants
  "ruff==0.7.4",
  "mypy==1.13.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501"]  # ruff formatter handles line length

[tool.ruff.lint.per-file-ignores]
# __init__.py files deliberately re-export names from their submodules
# (parent-agent packages, oncotwin subpackages) so callers can do
# `from app.agents.appeals_drafter import draft_appeal` instead of reaching
# into the submodule. That's the intended pattern, not a dead import.
"__init__.py" = ["F401"]
# B008 ("function call in argument default") fires on FastAPI's own required
# idiom: `Depends(...)`, `Depends(require_role(...))`, and `File(...)` MUST be
# evaluated as parameter defaults — that's how FastAPI builds its dependency-
# injection graph at route-registration time. Moving these calls inside the
# function body (ruff's suggested fix) would silently break auth and file
# uploads app-wide. Scoped to the three dirs that actually define FastAPI
# routes/dependencies (confirmed via `ruff check --select B008`).
"app/api/**/*.py" = ["B008"]
"app/auth/**/*.py" = ["B008"]
"app/integrations/**/*.py" = ["B008"]
# N806/N803/N812 ("should be lowercase") false-positive on the OncoTwin
# simulator's linear-algebra / matrix code, which deliberately follows
# NumPy/stats convention: capitals for matrices (Z, R, B) and short module
# aliases (`from app.oncotwin.simulator import physiology as P`), while
# scalars/vectors stay lowercase. Renaming would fight the domain's own
# notation for no readability gain. Confirmed via `ruff check --select
# N806,N803,N812` that every finding here is in the numerical layers
# (engine/ml/intel/research/mlops/simulator/features), none in oncotwin's
# own API/router code.
"app/oncotwin/**/*.py" = ["N806", "N803", "N812"]
"tests/oncotwin/**/*.py" = ["N806"]
# F405 ("may be undefined, or defined from star imports") is the expected
# companion to each agent's `from app.agents.<name>.schemas import *`
# (already accepted via its own `# noqa: F401,F403`) — every agent node.py
# uses this so `AppealsDrafterInput(...)` etc. work without repeating a long
# explicit import list per agent. N814 covers the short legacy-shim aliases
# (`ClinicalSnapshot as _CS`, `AssembleStage as _A`) used the same way. Both
# confirmed via `ruff check --select F405,N814` to be entirely this pattern.
"app/agents/**/*.py" = ["F405", "N814"]
# E741 flags the `I`/`O` TypeVars (`Agent[I, O]` = Input/Output) defined once
# in framework/agent.py + framework/types.py and used as the generic type
# parameters across all 41 agent class definitions. They read visually like
# 1/0 in isolation but are unambiguous in their actual `Agent[SomeInput,
# SomeOutput]` bracket-syntax usage. Renaming would touch every agent file
# for a cosmetic gain; scoped to just the two files that declare them.
"app/agents/framework/agent.py" = ["E741"]
"app/agents/framework/types.py" = ["E741"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration and not live'"
markers = [
  "integration: requires an external service such as PostgreSQL",
  "postgres: requires a PostgreSQL database initialized with backend/db/schema.sql",
  "live: calls a metered external model provider and requires provider credentials",
]
