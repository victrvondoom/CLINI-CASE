# One ServiceAccount per workload. Nothing in this stack talks to the Kubernetes API, so no token is
# mounted (automountServiceAccountToken: false here AND on every pod spec) and there is deliberately
# NO Role, ClusterRole or binding anywhere in this directory -- least privilege is "no privilege".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: receiver
  labels:
    app.kubernetes.io/name: receiver
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: receiver
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: database
automountServiceAccountToken: false
