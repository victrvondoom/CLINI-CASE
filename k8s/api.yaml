# The ClinCase API (uvicorn app.main:app). One replica: with REDIS_URL empty, SSE pub/sub is
# in-process, so a second replica would not see the first one's live events.
#
# Secrets come only from the Secret `clinicase-secrets` (generated by `cluster.py up`); everything
# non-secret comes from the ConfigMap `clinicase-config`. The Downward API variables let
# GET /api/v1/runtime report the identity of the pod that actually answered.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: clinicase
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The api opens its connection pool during startup and fail-softs to a DB-less mode if
        # PostgreSQL is not reachable yet. Waiting here makes first boot deterministic: the Service
        # only has an endpoint once the postgres pod passes its (TCP) readiness probe.
        - name: wait-for-postgres
          image: clinicase-api:local
          imagePullPolicy: Never
          command: ["python", "-c"]
          args:
            - |
              import socket, sys, time
              deadline = time.monotonic() + 240
              while time.monotonic() < deadline:
                  try:
                      socket.create_connection(("postgres", 5432), timeout=3).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit("postgres:5432 not reachable after 240s")
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: api
          # Loaded into kind by `cluster.py up` (kind load docker-image); never pulled from a registry.
          image: clinicase-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: clinicase-config
          env:
            # Read-only root filesystem: keep every library's cache/config writes on the emptyDir.
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: JWT_SECRET
            - name: INTEROP_RECEIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: INTEROP_RECEIVER_TOKEN
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: DEMO_USER_PASSWORD
            - name: PASSPORT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: PASSPORT_SIGNING_KEY
                  optional: true # absent => passports export UNSIGNED (hash chain only), never a fake signature
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 192Mi  # about 140 MiB resident when idle after the Track 7 demo
            limits:
              cpu: "1"
              memory: 1Gi
          # Python import + schema bootstrap + demo-user seeding is slow on a throttled local node.
          # The startup probe keeps liveness from killing the pod during that window (up to 3 min).
          startupProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          # Liveness is process-only (/healthz never touches the database): a database outage must
          # not restart the api. Readiness (/readyz) does query the database and returns 503 until
          # the schema is usable, so traffic is only routed to a pod that can persist cases.
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Local policy store: app/api/policies.py creates <app>/data/policies (+ .trash) at runtime.
            - name: policy-store
              mountPath: /app/data/policies
            # The image ships <app>/data/interop (Track 7 demo payloads); nothing may mount over /app/data.
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policy-store
          emptyDir: {}
