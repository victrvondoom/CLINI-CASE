# Track 7 System B: the independent synthetic clinical receiver. It runs from the same image as the
# api (clinicase-api:local, built from backend/Dockerfile) but is a separate process with its own
# SQLite store and its own bearer token, reachable only from the api (see networkpolicies.yaml).
# The api talks to it over HTTP at http://receiver:8091, which is what makes the Track 7 demo a real
# network exchange (`receiver_mode == "HTTP network"`).
#
# Receipts live in an emptyDir: they survive container restarts but not pod re-creation. That is
# deliberate for a disposable local demo; the exchange evidence (jobs, events, passport) lives in
# PostgreSQL on the api side.
apiVersion: v1
kind: Service
metadata:
  name: receiver
  labels:
    app.kubernetes.io/name: receiver
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: receiver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: receiver
  ports:
    - name: http
      port: 8091
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  labels:
    app.kubernetes.io/name: receiver
    app.kubernetes.io/part-of: clinicase
    app.kubernetes.io/component: receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receiver
        app.kubernetes.io/part-of: clinicase
        app.kubernetes.io/component: receiver
    spec:
      serviceAccountName: receiver
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          # Loaded into kind by `cluster.py up` (kind load docker-image); never pulled from a registry.
          image: clinicase-api:local
          imagePullPolicy: Never
          command: ["uvicorn", "app.interop.receiver:app", "--host", "0.0.0.0", "--port", "8091"]
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: INTEROP_RECEIVER_DB
              value: /data/receipts.sqlite
            - name: INTEROP_RECEIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clinicase-secrets
                  key: INTEROP_RECEIVER_TOKEN
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 96Mi  # about 58 MiB resident
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: receiver-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: receiver-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
