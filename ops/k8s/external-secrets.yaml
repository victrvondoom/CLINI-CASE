# ─── Secrets from AWS Secrets Manager via External Secrets Operator ───────────────────────────────
# Prerequisites (NOT created by this repository): External Secrets Operator installed in the cluster; an
# IAM role for the `clincase-api` ServiceAccount (IRSA) with secretsmanager:GetSecretValue (+ kms:Decrypt)
# on the secrets below. Secret names follow ops/terraform/secrets-rotation; `clincase/demo-user-password`
# is a deployment input. UNVERIFIED ASSUMPTIONS to confirm before applying: (1) `clincase/postgres-master`
# is a JSON secret with username, password and host fields (the standard RDS rotation layout); (2) the
# installed External Secrets Operator serves external-secrets.io/v1beta1 — newer releases deprecate it in
# favour of /v1, in which case change apiVersion below. Nothing sensitive is stored in git.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: clincase-aws
  namespace: clincase
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: clincase-api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clincase-secrets
  namespace: clincase
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clincase-aws
    kind: SecretStore
  target:
    name: clincase-secrets
    creationPolicy: Owner
    template:
      data:
        JWT_SECRET: "{{ .jwt }}"
        DEMO_USER_PASSWORD: "{{ .demo }}"
        # Credentials are URL-encoded so generated passwords containing @ / : ? # stay valid.
        DATABASE_URL: "postgresql://{{ .dbuser | urlquery }}:{{ .dbpass | urlquery }}@{{ .dbhost }}:5432/clincase?sslmode=require"
  data:
    - secretKey: jwt
      remoteRef: { key: clincase/jwt-secret }
    - secretKey: demo
      remoteRef: { key: clincase/demo-user-password }
    - secretKey: dbuser
      remoteRef: { key: clincase/postgres-master, property: username }
    - secretKey: dbpass
      remoteRef: { key: clincase/postgres-master, property: password }
    - secretKey: dbhost
      remoteRef: { key: clincase/postgres-master, property: host }
---
# KEDA's Postgres trigger reads this secret (see keda/scaledobject-worker.yaml). TLS is required.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clincase-keda-postgres-conn
  namespace: clincase
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clincase-aws
    kind: SecretStore
  target:
    name: clincase-keda-postgres-conn
    creationPolicy: Owner
    template:
      data:
        connection: "postgresql://{{ .dbuser | urlquery }}:{{ .dbpass | urlquery }}@{{ .dbhost }}:5432/clincase?sslmode=require"
  data:
    - secretKey: dbuser
      remoteRef: { key: clincase/postgres-master, property: username }
    - secretKey: dbpass
      remoteRef: { key: clincase/postgres-master, property: password }
    - secretKey: dbhost
      remoteRef: { key: clincase/postgres-master, property: host }
